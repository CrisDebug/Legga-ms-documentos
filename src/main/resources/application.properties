spring.application.name=ms-documentos

# Puerto HTTP
server.port=${PORT:8080}

# PostgreSQL: configuración por variables de entorno
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=documentos

# Health check para Azure Container Apps
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# Azure Blob Storage
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:documentos}

# URL interna de MS-Legajos para validar existencia y estado del legajo
legga.ms-legajos.base-url=${MS_LEGAJOS_URL:http://localhost:8081}